[project]
name = "guide-cli"
version = "0.1.0"
description = "A local inbox for the questions your agents need answered."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AStrayByte" }]
keywords = ["claude", "agents", "review", "human-in-the-loop"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]

# Three dependencies, deliberately. See docs/decisions/0003-python-and-uv.md —
# anything not on this list is either stdlib or not worth the weight.
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/AStrayByte/GUIde"

[project.scripts]
guide = "guide.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "D", "S", "PL"]
ignore = [
  "D203",   # incompatible with D211
  "D213",   # incompatible with D212
  "ANN401", # Any is the right type for opaque passthrough data
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "S101", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"
